							<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serpent Grid XR — Growth Power-Up Preview</title>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 42%, #102712 0%, #07100a 48%, #000404 100%);
      font-family: Arial, Helvetica, sans-serif;
    }

    #app { width: 100vw; height: 100vh; }

    .hud {
      position: fixed;
      left: 24px;
      bottom: 24px;
      padding: 14px 16px;
      border: 1px solid rgba(120, 255, 90, 0.34);
      border-radius: 16px;
      background: rgba(4, 16, 6, 0.74);
      color: #efffe8;
      box-shadow: 0 0 30px rgba(120, 255, 90, 0.14), inset 0 0 24px rgba(120, 255, 90, 0.045);
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    .hud strong {
      display: block;
      color: #8dff63;
      font-size: 14px;
      letter-spacing: 0.14em;
      margin-bottom: 6px;
    }

    .hud span {
      color: #b8cfae;
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .error {
      position: fixed;
      inset: 24px;
      display: none;
      place-items: center;
      padding: 24px;
      border: 1px solid rgba(255, 80, 80, 0.45);
      border-radius: 18px;
      background: rgba(20, 2, 4, 0.88);
      color: #ffd8d8;
      line-height: 1.5;
      white-space: pre-wrap;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="app" aria-label="Three.js growth power-up card preview"></div>
  <div class="hud">
    <strong>GROWTH POWER-UP</strong>
    <span>pickup.preview · grow faster · xr-ready card</span>
  </div>
  <div id="error" class="error"></div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

    const container = document.getElementById("app");
    const errorPanel = document.getElementById("error");

    function showError(error) {
      console.error(error);
      errorPanel.style.display = "grid";
      errorPanel.textContent = `Preview failed to start:\n\n${error?.message || error}`;
    }

    function assertPreview(condition, message) {
      if (!condition) throw new Error(`Preview test failed: ${message}`);
      console.assert(condition, message);
    }

    function roundedRectShape(width, height, radius) {
      const x = -width / 2;
      const y = -height / 2;
      const shape = new THREE.Shape();
      shape.moveTo(x + radius, y);
      shape.lineTo(x + width - radius, y);
      shape.quadraticCurveTo(x + width, y, x + width, y + radius);
      shape.lineTo(x + width, y + height - radius);
      shape.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      shape.lineTo(x + radius, y + height);
      shape.quadraticCurveTo(x, y + height, x, y + height - radius);
      shape.lineTo(x, y + radius);
      shape.quadraticCurveTo(x, y, x + radius, y);
      return shape;
    }

    function createRoundedPanel(width, height, depth, radius, material) {
      const geometry = new THREE.ExtrudeGeometry(roundedRectShape(width, height, radius), {
        depth,
        bevelEnabled: true,
        bevelSegments: 8,
        bevelSize: 0.035,
        bevelThickness: 0.035
      });
      geometry.center();
      return new THREE.Mesh(geometry, material);
    }

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function createTextSprite(text, options = {}) {
      const {
        width = 900,
        height = 240,
        fontSize = 76,
        weight = 700,
        textColor = "#f4fff0",
        glowColor = "rgba(120,255,90,0.42)",
        background = "rgba(0,0,0,0)",
        borderColor = "rgba(0,0,0,0)"
      } = options;

      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, width, height);

      if (background !== "rgba(0,0,0,0)") {
        ctx.fillStyle = background;
        roundRect(ctx, 18, 18, width - 36, height - 36, 32);
        ctx.fill();
        ctx.strokeStyle = borderColor;
        ctx.lineWidth = 4;
        ctx.stroke();
      }

      ctx.font = `${weight} ${fontSize}px Arial`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.shadowColor = glowColor;
      ctx.shadowBlur = 24;
      ctx.fillStyle = textColor;
      ctx.fillText(text, width / 2, height / 2 + 4);
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(255,255,255,0.16)";
      ctx.lineWidth = 2;
      ctx.strokeText(text, width / 2, height / 2 + 4);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthWrite: false }));
      sprite.scale.set(width / 520, height / 520, 1);
      return sprite;
    }

    function createLeafShape(scale = 1) {
      const shape = new THREE.Shape();
      shape.moveTo(0, -0.22 * scale);
      shape.bezierCurveTo(0.34 * scale, -0.05 * scale, 0.44 * scale, 0.28 * scale, 0.15 * scale, 0.50 * scale);
      shape.bezierCurveTo(-0.12 * scale, 0.31 * scale, -0.25 * scale, 0.06 * scale, 0, -0.22 * scale);
      return shape;
    }

    function createLeafMesh({ scale = 1, rotation = 0, position = [0, 0, 0], color = 0x8dff63 } = {}) {
      const shape = createLeafShape(scale);
      const geometry = new THREE.ExtrudeGeometry(shape, {
        depth: 0.045,
        bevelEnabled: true,
        bevelSegments: 6,
        bevelSize: 0.012,
        bevelThickness: 0.018
      });
      geometry.center();

      const leaf = new THREE.Mesh(
        geometry,
        new THREE.MeshPhysicalMaterial({
          color,
          emissive: 0x51ff22,
          emissiveIntensity: 0.85,
          roughness: 0.16,
          metalness: 0.08,
          clearcoat: 1,
          clearcoatRoughness: 0.05,
          transparent: true,
          opacity: 0.94
        })
      );
      leaf.position.set(...position);
      leaf.rotation.z = rotation;
      leaf.name = "GrowthLeafMesh";

      const outline = new THREE.LineLoop(
        new THREE.BufferGeometry().setFromPoints(shape.getPoints(64).map((p) => new THREE.Vector3(p.x, p.y, 0.04))),
        new THREE.LineBasicMaterial({ color: 0xd9ffc8, transparent: true, opacity: 0.54, blending: THREE.AdditiveBlending })
      );
      outline.name = "LeafGlowOutline";
      leaf.add(outline);

      const vein = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(-0.10 * scale, -0.16 * scale, 0.052),
          new THREE.Vector3(0.13 * scale, 0.32 * scale, 0.052)
        ]),
        new THREE.LineBasicMaterial({ color: 0xeaffdd, transparent: true, opacity: 0.32, blending: THREE.AdditiveBlending })
      );
      vein.name = "LeafVein";
      leaf.add(vein);

      return leaf;
    }

    function createGrowthEmblem() {
      const group = new THREE.Group();
      group.name = "GrowthEmblem";

      const aura = new THREE.Mesh(
        new THREE.CircleGeometry(0.76, 128),
        new THREE.MeshBasicMaterial({
          color: 0x66ff33,
          transparent: true,
          opacity: 0.12,
          side: THREE.DoubleSide,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        })
      );
      aura.name = "GrowthAura";
      aura.position.z = -0.02;
      group.add(aura);

      const ringMaterial = new THREE.MeshBasicMaterial({
        color: 0x8dff63,
        transparent: true,
        opacity: 0.72,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const outerRing = new THREE.Mesh(new THREE.RingGeometry(0.59, 0.625, 128), ringMaterial);
      outerRing.name = "OuterGrowthRing";
      group.add(outerRing);

      const innerRing = new THREE.Mesh(new THREE.RingGeometry(0.42, 0.445, 128), ringMaterial.clone());
      innerRing.name = "InnerGrowthRing";
      innerRing.material.opacity = 0.42;
      group.add(innerRing);

      const stem = new THREE.Mesh(
        new THREE.BoxGeometry(0.055, 0.72, 0.045),
        new THREE.MeshPhysicalMaterial({
          color: 0x7dff55,
          emissive: 0x45dd22,
          emissiveIntensity: 0.7,
          roughness: 0.18,
          metalness: 0.06,
          clearcoat: 1
        })
      );
      stem.name = "GrowthStem";
      stem.position.set(-0.03, -0.08, 0.08);
      stem.rotation.z = -0.34;
      group.add(stem);

      const leafA = createLeafMesh({ scale: 0.66, rotation: -0.25, position: [0.14, 0.12, 0.12] });
      leafA.name = "TopGrowthLeaf";
      group.add(leafA);

      const leafB = createLeafMesh({ scale: 0.46, rotation: -1.05, position: [-0.20, -0.05, 0.12], color: 0x73ec51 });
      leafB.name = "LeftGrowthLeaf";
      group.add(leafB);

      const leafC = createLeafMesh({ scale: 0.50, rotation: -0.78, position: [0.19, -0.22, 0.12], color: 0x7cff58 });
      leafC.name = "LowerGrowthLeaf";
      group.add(leafC);

      const tickMaterial = new THREE.MeshBasicMaterial({
        color: 0xcfffba,
        transparent: true,
        opacity: 0.48,
        blending: THREE.AdditiveBlending
      });
      for (let i = 0; i < 12; i++) {
        const tick = new THREE.Mesh(new THREE.BoxGeometry(0.014, i % 3 === 0 ? 0.12 : 0.064, 0.012), tickMaterial);
        const a = (Math.PI * 2 * i) / 12;
        tick.name = `GrowthHudTick_${i}`;
        tick.position.set(Math.cos(a) * 0.52, Math.sin(a) * 0.52, 0.04);
        tick.rotation.z = a;
        group.add(tick);
      }

      const light = new THREE.PointLight(0x7dff45, 2.8, 3.2);
      light.name = "GrowthGreenPointLight";
      light.position.set(0, 0.02, 0.38);
      group.add(light);

      return group;
    }

    function createHexPattern(width, height, z) {
      const group = new THREE.Group();
      const mat = new THREE.LineBasicMaterial({
        color: 0x78ff55,
        transparent: true,
        opacity: 0.055,
        blending: THREE.AdditiveBlending
      });

      const r = 0.055;
      const dx = r * 1.75;
      const dy = r * 1.52;
      for (let y = -height / 2; y <= height / 2; y += dy) {
        for (let x = -width / 2; x <= width / 2; x += dx) {
          const offsetX = Math.round((y + height / 2) / dy) % 2 === 0 ? 0 : dx / 2;
          const pts = [];
          for (let i = 0; i < 6; i++) {
            const a = Math.PI / 3 * i + Math.PI / 6;
            pts.push(new THREE.Vector3(x + offsetX + Math.cos(a) * r, y + Math.sin(a) * r, z));
          }
          group.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), mat));
        }
      }
      return group;
    }

    function createGrowthCard() {
      const card = new THREE.Group();
      card.name = "GrowthPowerupCard";
      card.userData = {
        type: "pickup-card",
        pickupId: "powerup.growth.growFaster",
        effect: "grow-faster",
        growthMultiplier: 1.5,
        xrReadable: true
      };

      const backMaterial = new THREE.MeshStandardMaterial({
        color: 0x061006,
        roughness: 0.50,
        metalness: 0.34,
        transparent: true,
        opacity: 0.95,
        emissive: 0x0e3008,
        emissiveIntensity: 0.28
      });

      const panel = createRoundedPanel(2.35, 2.65, 0.10, 0.18, backMaterial);
      panel.name = "DarkRoundedCardPanel";
      panel.castShadow = true;
      panel.receiveShadow = true;
      card.add(panel);

      const frameMaterial = new THREE.LineBasicMaterial({
        color: 0x8dff63,
        transparent: true,
        opacity: 0.76,
        blending: THREE.AdditiveBlending
      });

      const outerFrame = new THREE.LineLoop(
        new THREE.BufferGeometry().setFromPoints(roundedRectShape(2.45, 2.75, 0.22).getPoints(96).map((p) => new THREE.Vector3(p.x, p.y, 0.07))),
        frameMaterial
      );
      outerFrame.name = "OuterNeonGreenFrame";
      card.add(outerFrame);

      const innerFrame = new THREE.LineLoop(
        new THREE.BufferGeometry().setFromPoints(roundedRectShape(2.18, 2.48, 0.16).getPoints(96).map((p) => new THREE.Vector3(p.x, p.y, 0.075))),
        frameMaterial.clone()
      );
      innerFrame.name = "InnerNeonGreenFrame";
      innerFrame.material.opacity = 0.42;
      card.add(innerFrame);

      const honeycomb = createHexPattern(2.0, 2.2, 0.075);
      honeycomb.name = "SubtleHexBackground";
      card.add(honeycomb);

      const emblem = createGrowthEmblem();
      emblem.name = "GrowthGrowFasterEmblem";
      emblem.position.set(0, 0.48, 0.13);
      card.add(emblem);

      const title = createTextSprite("Growth", {
        width: 900,
        height: 210,
        fontSize: 100,
        textColor: "#f3fff0",
        glowColor: "rgba(130,255,90,0.38)"
      });
      title.name = "TitleTextGrowth";
      title.position.set(0, -0.73, 0.16);
      title.scale.set(0.95, 0.24, 1);
      card.add(title);

      const subtitle = createTextSprite("Grow Faster", {
        width: 800,
        height: 180,
        fontSize: 70,
        weight: 500,
        textColor: "#d7efcf",
        glowColor: "rgba(130,255,90,0.28)"
      });
      subtitle.name = "SubtitleTextGrowFaster";
      subtitle.position.set(0, -1.03, 0.16);
      subtitle.scale.set(0.78, 0.18, 1);
      card.add(subtitle);

      const bottomNotch = new THREE.Mesh(
        new THREE.BoxGeometry(0.32, 0.035, 0.035),
        new THREE.MeshBasicMaterial({ color: 0x9cff6e, transparent: true, opacity: 0.82, blending: THREE.AdditiveBlending })
      );
      bottomNotch.name = "BottomGlowNotch";
      bottomNotch.position.set(0, -1.30, 0.15);
      card.add(bottomNotch);

      const cardGlow = new THREE.PointLight(0x83ff55, 1.9, 4.0);
      cardGlow.name = "CardGreenGlowLight";
      cardGlow.position.set(0, 0.2, 0.45);
      card.add(cardGlow);

      return card;
    }

    function createDisplayPlatform() {
      const platform = new THREE.Group();
      platform.name = "GreenDisplayPlatform";

      const ringMaterial = new THREE.MeshBasicMaterial({
        color: 0x83ff55,
        transparent: true,
        opacity: 0.22,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending
      });

      [0.95, 1.35, 1.75].forEach((radius, index) => {
        const ring = new THREE.Mesh(new THREE.RingGeometry(radius, radius + 0.012, 128), ringMaterial.clone());
        ring.name = `PlatformRing_${index}`;
        ring.material.opacity = 0.24 - index * 0.055;
        ring.rotation.x = -Math.PI / 2;
        ring.position.y = -1.42 + index * 0.003;
        platform.add(ring);
      });

      return platform;
    }

    function runPreviewTests({ scene, renderer, card, composer }) {
      assertPreview(THREE.REVISION === "164", `Expected Three.js r164, got r${THREE.REVISION}`);
      assertPreview(renderer instanceof THREE.WebGLRenderer, "Renderer was created.");
      assertPreview(renderer.xr.enabled === true, "WebXR flag is enabled.");
      assertPreview(scene.getObjectByName("GrowthPowerupCard") === card, "Growth card exists.");
      assertPreview(card.userData.pickupId === "powerup.growth.growFaster", "Card has growth pickup metadata.");
      assertPreview(card.userData.growthMultiplier === 1.5, "Growth multiplier metadata exists.");
      assertPreview(card.getObjectByName("GrowthGrowFasterEmblem") !== undefined, "Growth emblem exists.");
      assertPreview(card.getObjectByName("TitleTextGrowth")?.isSprite === true, "Title text exists.");
      assertPreview(card.getObjectByName("SubtitleTextGrowFaster")?.isSprite === true, "Subtitle text exists.");
      assertPreview(composer instanceof EffectComposer, "Bloom composer was created.");
    }

    try {
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x020802, 0.035);

      const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.01, 100);
      camera.position.set(0, 0.35, 4.4);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.12;
      container.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.target.set(0, 0, 0);
      controls.enablePan = false;

      scene.add(new THREE.AmbientLight(0x1a3318, 1.65));

      const key = new THREE.DirectionalLight(0xffffff, 2.2);
      key.position.set(1.8, 2.6, 3.2);
      key.castShadow = true;
      scene.add(key);

      const greenRim = new THREE.PointLight(0x83ff55, 3.2, 5.6);
      greenRim.position.set(-1.8, 1.2, 2.4);
      scene.add(greenRim);

      const card = createGrowthCard();
      card.position.set(0, 0.08, 0);
      card.rotation.x = -0.04;
      scene.add(card);

      const platform = createDisplayPlatform();
      scene.add(platform);

      const floor = new THREE.Mesh(
        new THREE.CircleGeometry(2.9, 128),
        new THREE.MeshStandardMaterial({
          color: 0x030a04,
          roughness: 0.72,
          metalness: 0.22,
          transparent: true,
          opacity: 0.82
        })
      );
      floor.name = "DarkGreenReferenceFloor";
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -1.44;
      floor.receiveShadow = true;
      scene.add(floor);

      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.05, 0.46, 0.10));

      runPreviewTests({ scene, renderer, card, composer });

      function resize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
      }
      window.addEventListener("resize", resize);

      renderer.setAnimationLoop(() => {
        const t = performance.now() * 0.001;
        controls.update();

        card.position.y = 0.08 + Math.sin(t * 1.25) * 0.025;
        card.rotation.y = Math.sin(t * 0.6) * 0.035;

        const emblem = card.getObjectByName("GrowthGrowFasterEmblem");
        const aura = emblem?.getObjectByName("GrowthAura");
        const outerRing = emblem?.getObjectByName("OuterGrowthRing");
        const innerRing = emblem?.getObjectByName("InnerGrowthRing");
        const growthLight = emblem?.getObjectByName("GrowthGreenPointLight");
        const cardLight = card.getObjectByName("CardGreenGlowLight");

        if (outerRing) outerRing.rotation.z += 0.004;
        if (innerRing) innerRing.rotation.z -= 0.006;
        if (aura) aura.material.opacity = 0.11 + Math.sin(t * 3.2) * 0.028;
        if (growthLight) growthLight.intensity = 2.5 + Math.sin(t * 4.1) * 0.55;
        if (cardLight) cardLight.intensity = 1.7 + Math.sin(t * 3.1) * 0.30;

        platform.rotation.y -= 0.0014;
        composer.render();
      });
    } catch (error) {
      showError(error);
    }
  </script>


</body></html>
