							<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serpent Grid XR — Silver Shield Power-Up Preview — No Center Shine</title>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 42%, #111820 0%, #05080d 50%, #000205 100%);
      font-family: Arial, Helvetica, sans-serif;
    }

    #app {
      width: 100vw;
      height: 100vh;
    }

    .hud {
      position: fixed;
      left: 24px;
      bottom: 24px;
      padding: 14px 16px;
      border: 1px solid rgba(200, 215, 225, 0.28);
      border-radius: 16px;
      background: rgba(7, 10, 14, 0.74);
      color: #eef3f7;
      box-shadow: 0 0 24px rgba(180, 205, 220, 0.08), inset 0 0 24px rgba(210, 220, 230, 0.035);
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    .hud strong {
      display: block;
      color: #d5dde5;
      font-size: 14px;
      letter-spacing: 0.14em;
      margin-bottom: 6px;
    }

    .hud span {
      color: #aebbc6;
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .error {
      position: fixed;
      inset: 24px;
      display: none;
      place-items: center;
      padding: 24px;
      border: 1px solid rgba(255, 80, 80, 0.45);
      border-radius: 18px;
      background: rgba(20, 2, 4, 0.88);
      color: #ffd8d8;
      line-height: 1.5;
      white-space: pre-wrap;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="app" aria-label="Three.js silver shield power-up card preview"></div>
  <div class="hud">
    <strong>SILVER SHIELD POWER-UP</strong>
    <span>pickup.preview · protect once · no center shine</span>
  </div>
  <div id="error" class="error"></div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

    const container = document.getElementById("app");
    const errorPanel = document.getElementById("error");

    function showError(error) {
      console.error(error);
      errorPanel.style.display = "grid";
      errorPanel.textContent = `Preview failed to start:\n\n${error?.message || error}`;
    }

    function assertPreview(condition, message) {
      if (!condition) throw new Error(`Preview test failed: ${message}`);
      console.assert(condition, message);
    }

    function roundedRectShape(width, height, radius) {
      const x = -width / 2;
      const y = -height / 2;
      const shape = new THREE.Shape();
      shape.moveTo(x + radius, y);
      shape.lineTo(x + width - radius, y);
      shape.quadraticCurveTo(x + width, y, x + width, y + radius);
      shape.lineTo(x + width, y + height - radius);
      shape.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      shape.lineTo(x + radius, y + height);
      shape.quadraticCurveTo(x, y + height, x, y + height - radius);
      shape.lineTo(x, y + radius);
      shape.quadraticCurveTo(x, y, x + radius, y);
      return shape;
    }

    function createRoundedPanel(width, height, depth, radius, material) {
      const geometry = new THREE.ExtrudeGeometry(roundedRectShape(width, height, radius), {
        depth,
        bevelEnabled: true,
        bevelSegments: 8,
        bevelSize: 0.035,
        bevelThickness: 0.035
      });
      geometry.center();
      return new THREE.Mesh(geometry, material);
    }

    function createTextSprite(text, options = {}) {
      const {
        width = 900,
        height = 240,
        fontSize = 76,
        weight = 700,
        textColor = "#f2f4f6",
        glowColor = "rgba(190,205,215,0.26)",
        background = "rgba(0,0,0,0)",
        borderColor = "rgba(0,0,0,0)"
      } = options;

      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, width, height);

      if (background !== "rgba(0,0,0,0)") {
        ctx.fillStyle = background;
        roundRect(ctx, 18, 18, width - 36, height - 36, 32);
        ctx.fill();
        ctx.strokeStyle = borderColor;
        ctx.lineWidth = 4;
        ctx.stroke();
      }

      ctx.font = `${weight} ${fontSize}px Arial`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.shadowColor = glowColor;
      ctx.shadowBlur = 14;
      ctx.fillStyle = textColor;
      ctx.fillText(text, width / 2, height / 2 + 4);
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(255,255,255,0.15)";
      ctx.lineWidth = 1.5;
      ctx.strokeText(text, width / 2, height / 2 + 4);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthWrite: false }));
      sprite.scale.set(width / 520, height / 520, 1);
      return sprite;
    }

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function createShieldShape(scale = 1) {
      const shape = new THREE.Shape();
      shape.moveTo(0, 0.58 * scale);
      shape.bezierCurveTo(0.36 * scale, 0.38 * scale, 0.50 * scale, 0.36 * scale, 0.52 * scale, 0.32 * scale);
      shape.bezierCurveTo(0.50 * scale, -0.20 * scale, 0.32 * scale, -0.45 * scale, 0, -0.66 * scale);
      shape.bezierCurveTo(-0.32 * scale, -0.45 * scale, -0.50 * scale, -0.20 * scale, -0.52 * scale, 0.32 * scale);
      shape.bezierCurveTo(-0.50 * scale, 0.36 * scale, -0.36 * scale, 0.38 * scale, 0, 0.58 * scale);
      return shape;
    }

    function createShieldEmblem() {
      const group = new THREE.Group();
      group.name = "ShieldEmblem";

      const haloMaterial = new THREE.MeshBasicMaterial({
        color: 0xb8c8d8,
        transparent: true,
        opacity: 0.045,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const halo = new THREE.Mesh(new THREE.CircleGeometry(0.76, 128), haloMaterial);
      halo.name = "ShieldHaloAura";
      halo.position.z = -0.02;
      group.add(halo);

      const ringMaterial = new THREE.MeshBasicMaterial({
        color: 0x9fb5c8,
        transparent: true,
        opacity: 0.18,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const ring = new THREE.Mesh(new THREE.RingGeometry(0.61, 0.624, 128), ringMaterial);
      ring.name = "SubtleCircularHudRing";
      group.add(ring);

      const shieldShape = createShieldShape(1);
      const shieldGeometry = new THREE.ExtrudeGeometry(shieldShape, {
        depth: 0.08,
        bevelEnabled: true,
        bevelSegments: 8,
        bevelSize: 0.025,
        bevelThickness: 0.035
      });
      shieldGeometry.center();

      const shieldMaterial = new THREE.MeshPhysicalMaterial({
        color: 0xd9dee5,
        emissive: 0x6f7f8f,
        emissiveIntensity: 0.03,
        roughness: 0.24,
        metalness: 0.86,
        clearcoat: 1,
        clearcoatRoughness: 0.08,
        transparent: true,
        opacity: 0.98
      });

      const shield = new THREE.Mesh(shieldGeometry, shieldMaterial);
      shield.name = "SilverShieldMesh";
      shield.position.z = 0.06;
      group.add(shield);

      const shieldOutline = new THREE.LineLoop(
        new THREE.BufferGeometry().setFromPoints(shieldShape.getPoints(96).map((p) => new THREE.Vector3(p.x, p.y, 0.125))),
        new THREE.LineBasicMaterial({ color: 0xcfd6df, transparent: true, opacity: 0.48, blending: THREE.AdditiveBlending })
      );
      shieldOutline.name = "SoftSilverShieldOutline";
      group.add(shieldOutline);

      const innerOutlineShape = createShieldShape(0.76);
      const innerOutline = new THREE.LineLoop(
        new THREE.BufferGeometry().setFromPoints(innerOutlineShape.getPoints(96).map((p) => new THREE.Vector3(p.x, p.y - 0.02, 0.13))),
        new THREE.LineBasicMaterial({ color: 0xb9c3cf, transparent: true, opacity: 0.24, blending: THREE.AdditiveBlending })
      );
      innerOutline.name = "InnerShieldLine";
      group.add(innerOutline);

      const verticalLine = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(0, 0.49, 0.14),
          new THREE.Vector3(0, -0.58, 0.14)
        ]),
        new THREE.LineBasicMaterial({ color: 0xf4f7fa, transparent: true, opacity: 0.30, blending: THREE.AdditiveBlending })
      );
      verticalLine.name = "ShieldCenterDivider";
      group.add(verticalLine);

      const horizontalLine = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(-0.36, 0.02, 0.14),
          new THREE.Vector3(0.36, 0.02, 0.14)
        ]),
        new THREE.LineBasicMaterial({ color: 0xf4f7fa, transparent: true, opacity: 0.18, blending: THREE.AdditiveBlending })
      );
      horizontalLine.name = "ShieldHorizontalDivider";
      group.add(horizontalLine);

      // Center shine removed so the shield reads as silver metal instead of a blown-out white glow.

      const tickMaterial = new THREE.MeshBasicMaterial({
        color: 0xb7c7d6,
        transparent: true,
        opacity: 0.22,
        blending: THREE.AdditiveBlending
      });
      for (let i = 0; i < 8; i++) {
        const tick = new THREE.Mesh(new THREE.BoxGeometry(0.014, i % 2 === 0 ? 0.13 : 0.07, 0.012), tickMaterial);
        const a = (Math.PI * 2 * i) / 8;
        tick.name = `HudTick_${i}`;
        tick.position.set(Math.cos(a) * 0.68, Math.sin(a) * 0.68, 0.04);
        tick.rotation.z = a;
        group.add(tick);
      }

      const light = new THREE.PointLight(0xc9d7e6, 0.55, 1.8);
      light.name = "ShieldSilverPointLight";
      light.position.set(0, 0.05, 0.38);
      group.add(light);

      return group;
    }

    function createHexPattern(width, height, z) {
      const group = new THREE.Group();
      const mat = new THREE.LineBasicMaterial({
        color: 0xb0beca,
        transparent: true,
        opacity: 0.045,
        blending: THREE.AdditiveBlending
      });

      const r = 0.055;
      const dx = r * 1.75;
      const dy = r * 1.52;
      for (let y = -height / 2; y <= height / 2; y += dy) {
        for (let x = -width / 2; x <= width / 2; x += dx) {
          const offsetX = Math.round((y + height / 2) / dy) % 2 === 0 ? 0 : dx / 2;
          const pts = [];
          for (let i = 0; i < 6; i++) {
            const a = Math.PI / 3 * i + Math.PI / 6;
            pts.push(new THREE.Vector3(x + offsetX + Math.cos(a) * r, y + Math.sin(a) * r, z));
          }
          group.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), mat));
        }
      }
      return group;
    }

    function createShieldCard() {
      const card = new THREE.Group();
      card.name = "ShieldPowerupCard";
      card.userData = {
        type: "pickup-card",
        pickupId: "powerup.shield.protectOnce",
        protectionCharges: 1,
        effect: "blocks-one-hit",
        visualStyle: "silver-low-glow",
        xrReadable: true
      };

      const backMaterial = new THREE.MeshStandardMaterial({
        color: 0x070a0f,
        roughness: 0.52,
        metalness: 0.38,
        transparent: true,
        opacity: 0.96,
        emissive: 0x101820,
        emissiveIntensity: 0.10
      });

      const panel = createRoundedPanel(2.35, 2.65, 0.10, 0.18, backMaterial);
      panel.name = "DarkRoundedCardPanel";
      panel.castShadow = true;
      panel.receiveShadow = true;
      card.add(panel);

      const frameMaterial = new THREE.LineBasicMaterial({
        color: 0x9fb2c2,
        transparent: true,
        opacity: 0.46,
        blending: THREE.AdditiveBlending
      });

      const outerFrame = new THREE.LineLoop(
        new THREE.BufferGeometry().setFromPoints(roundedRectShape(2.45, 2.75, 0.22).getPoints(96).map((p) => new THREE.Vector3(p.x, p.y, 0.07))),
        frameMaterial
      );
      outerFrame.name = "OuterSilverFrame";
      card.add(outerFrame);

      const innerFrame = new THREE.LineLoop(
        new THREE.BufferGeometry().setFromPoints(roundedRectShape(2.18, 2.48, 0.16).getPoints(96).map((p) => new THREE.Vector3(p.x, p.y, 0.075))),
        frameMaterial.clone()
      );
      innerFrame.name = "InnerSilverFrame";
      innerFrame.material.opacity = 0.25;
      card.add(innerFrame);

      const honeycomb = createHexPattern(2.0, 2.2, 0.075);
      honeycomb.name = "SubtleHexBackground";
      card.add(honeycomb);

      const emblem = createShieldEmblem();
      emblem.name = "ShieldProtectOnceEmblem";
      emblem.position.set(0, 0.48, 0.13);
      card.add(emblem);

      const title = createTextSprite("Shield", {
        width: 900,
        height: 210,
        fontSize: 100,
        textColor: "#f2f4f6",
        glowColor: "rgba(190,205,215,0.22)"
      });
      title.name = "TitleTextShield";
      title.position.set(0, -0.73, 0.16);
      title.scale.set(0.95, 0.24, 1);
      card.add(title);

      const subtitle = createTextSprite("Protect Once", {
        width: 800,
        height: 180,
        fontSize: 70,
        weight: 500,
        textColor: "#c7d0d8",
        glowColor: "rgba(190,205,215,0.14)"
      });
      subtitle.name = "SubtitleTextProtectOnce";
      subtitle.position.set(0, -1.03, 0.16);
      subtitle.scale.set(0.78, 0.18, 1);
      card.add(subtitle);

      const bottomNotch = new THREE.Mesh(
        new THREE.BoxGeometry(0.32, 0.035, 0.035),
        new THREE.MeshBasicMaterial({ color: 0xc7d3de, transparent: true, opacity: 0.40, blending: THREE.AdditiveBlending })
      );
      bottomNotch.name = "BottomSilverNotch";
      bottomNotch.position.set(0, -1.30, 0.15);
      card.add(bottomNotch);

      const cardGlow = new THREE.PointLight(0xc9d7e6, 0.9, 3.0);
      cardGlow.name = "CardSilverGlowLight";
      cardGlow.position.set(0, 0.2, 0.45);
      card.add(cardGlow);

      return card;
    }

    function createDisplayPlatform() {
      const platform = new THREE.Group();
      platform.name = "SilverDisplayPlatform";

      const ringMaterial = new THREE.MeshBasicMaterial({
        color: 0xb8c8d8,
        transparent: true,
        opacity: 0.12,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending
      });

      [0.95, 1.35, 1.75].forEach((radius, index) => {
        const ring = new THREE.Mesh(new THREE.RingGeometry(radius, radius + 0.012, 128), ringMaterial.clone());
        ring.name = `PlatformRing_${index}`;
        ring.material.opacity = 0.14 - index * 0.035;
        ring.rotation.x = -Math.PI / 2;
        ring.position.y = -1.42 + index * 0.003;
        platform.add(ring);
      });

      return platform;
    }

    function runPreviewTests({ scene, renderer, card, composer }) {
      assertPreview(THREE.REVISION === "164", `Expected Three.js r164, got r${THREE.REVISION}`);
      assertPreview(renderer instanceof THREE.WebGLRenderer, "Renderer was created.");
      assertPreview(renderer.xr.enabled === true, "WebXR flag is enabled.");
      assertPreview(scene.getObjectByName("ShieldPowerupCard") === card, "Shield card exists.");
      assertPreview(card.userData.pickupId === "powerup.shield.protectOnce", "Card has shield pickup metadata.");
      assertPreview(card.userData.protectionCharges === 1, "Shield has one protection charge.");
      assertPreview(card.userData.visualStyle === "silver-low-glow", "Card is using silver low-glow style.");
      assertPreview(card.getObjectByName("ShieldProtectOnceEmblem") !== undefined, "Shield emblem exists.");
      assertPreview(card.getObjectByName("TitleTextShield")?.isSprite === true, "Title text exists.");
      assertPreview(card.getObjectByName("SubtitleTextProtectOnce")?.isSprite === true, "Subtitle text exists.");
      assertPreview(composer instanceof EffectComposer, "Bloom composer was created.");
    }

    try {
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x02060d, 0.035);

      const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.01, 100);
      camera.position.set(0, 0.35, 4.4);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.96;
      container.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.target.set(0, 0, 0);
      controls.enablePan = false;

      scene.add(new THREE.AmbientLight(0x2a3036, 1.45));

      const key = new THREE.DirectionalLight(0xffffff, 2.2);
      key.position.set(1.8, 2.6, 3.2);
      key.castShadow = true;
      scene.add(key);

      const silverRim = new THREE.PointLight(0xd6e2eb, 1.4, 4.6);
      silverRim.position.set(-1.8, 1.2, 2.4);
      scene.add(silverRim);

      const card = createShieldCard();
      card.position.set(0, 0.08, 0);
      card.rotation.x = -0.04;
      scene.add(card);

      const platform = createDisplayPlatform();
      scene.add(platform);

      const floor = new THREE.Mesh(
        new THREE.CircleGeometry(2.9, 128),
        new THREE.MeshStandardMaterial({
          color: 0x05080c,
          roughness: 0.72,
          metalness: 0.25,
          transparent: true,
          opacity: 0.82
        })
      );
      floor.name = "DarkSilverReferenceFloor";
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -1.44;
      floor.receiveShadow = true;
      scene.add(floor);

      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.28, 0.22, 0.24));

      runPreviewTests({ scene, renderer, card, composer });

      function resize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
      }
      window.addEventListener("resize", resize);

      renderer.setAnimationLoop(() => {
        const t = performance.now() * 0.001;
        controls.update();

        card.position.y = 0.08 + Math.sin(t * 1.25) * 0.018;
        card.rotation.y = Math.sin(t * 0.6) * 0.025;

        const emblem = card.getObjectByName("ShieldProtectOnceEmblem");
        const halo = emblem?.getObjectByName("ShieldHaloAura");
        const ring = emblem?.getObjectByName("SubtleCircularHudRing");
        const shieldLight = emblem?.getObjectByName("ShieldSilverPointLight");
        const cardLight = card.getObjectByName("CardSilverGlowLight");
                if (ring) ring.rotation.z += 0.002;
        if (halo) halo.material.opacity = 0.04 + Math.sin(t * 3.2) * 0.008;
        if (shieldLight) shieldLight.intensity = 0.50 + Math.sin(t * 4.1) * 0.06;
        if (cardLight) cardLight.intensity = 0.55 + Math.sin(t * 3.1) * 0.05;

        platform.rotation.y -= 0.001;
        composer.render();
      });
    } catch (error) {
      showError(error);
    }
  </script>


</body></html>
